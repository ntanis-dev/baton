name: CI

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - xtask/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - clippy.toml
      - deny.toml
      - .cargo/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - crates/**
      - xtask/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - clippy.toml
      - deny.toml
      - .cargo/**
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Check that every locked crate is at least 14 days old
        run: cargo xtask lock-age
      - name: Check advisories, licences, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  # Windows is where Baton is built and used most, and where its runners cost the most, so it runs on
  # pull requests and on demand only, never on a push.
  windows:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
