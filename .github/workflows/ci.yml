name: CI

on:
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - scripts/**
      - package.json
      - package-lock.json
      - .npmrc
      - .prettierignore
      - .gitattributes
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - test/**
      - scripts/**
      - package.json
      - package-lock.json
      - .npmrc
      - .prettierignore
      - .gitattributes
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install the locked dependencies
        run: |
          npm ci
          npm audit signatures
          npm audit --omit=dev --audit-level=high
      - name: Check, lint and test
        run: |
          npm run check
          npm run lint
          npm test
