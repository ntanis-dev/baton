[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/profile",
    "crates/claude",
    "crates/install",
    "crates/tui",
    "crates/cli",
    "crates/testkit",
    "xtask",
]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Every dependency is declared once here with an exact pin, chosen as the newest stable release at least
# 14 days old (the release-age cooldown that `cargo xtask lock-age` checks over the whole Cargo.lock).
[workspace.dependencies]
# Workspace crates
baton-core = { path = "crates/core" }
baton-profile = { path = "crates/profile" }
baton-claude = { path = "crates/claude" }
baton-install = { path = "crates/install" }
baton-tui = { path = "crates/tui" }
baton-testkit = { path = "crates/testkit" }

# Third party
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "=0.29.0"
libc = "=0.2.191"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
# preserve_order: files Baton edits for the operator (~/.claude/settings.json) keep their key order.
# float_roundtrip: a number Baton did not change is written back exactly as it was read.
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "=0.10.9"
thiserror = "=2.0.21"
unicode-normalization = "=0.1.25"
uuid = { version = "=1.28.0", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

# Test only
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
