# cargo-deny configuration (`cargo deny check`; CI runs it on every change to the dependency graph).

[graph]
# Every target in the lockfile is checked, not only the host: Windows, macOS and Linux are all targets.
all-features = false

[advisories]
# RustSec. An advisory is acknowledged here with its id and the reason, in the same diff that accepts it,
# never silently.
yanked = "deny"
ignore = []

[licenses]
# All permissive. Nothing copyleft is allowed; a crate that needs another licence is reviewed and added
# here with the reason.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The list above is the policy, not an inventory, so licences no crate uses today are not reported.
unused-allowed-license = "allow"

[licenses.private]
# The workspace crates are unpublished and carry the repository's own licence file.
ignore = true

[bans]
# Two versions of one crate cost build time and binary size, not safety.
multiple-versions = "warn"
# `*` requirements are rejected; path dependencies of the workspace carry no version and are fine.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# crates.io is the only source.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
